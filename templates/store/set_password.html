{% extends 'store/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; margin-bottom: 20px;">Create Your Password</h2>
    <p style="text-align: center; color: #6b7280; margin-bottom: 20px;">Set a password to activate your account for <strong>{{ order.email }}</strong>.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="font-weight: 600; font-size: 0.9rem;">New Password</label>
            <input type="password" name="password" required minlength="8" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px;" placeholder="Enter at least 8 characters">
        </div>
        <button type="submit" style="width: 100%; padding: 14px; background: #0f9d58; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Activate Account</button>
    </form>
</div>
{% endblock %}
