{% extends 'store/base.html' %}
{% block title %}Login | Mini Mart{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; margin-bottom: 30px;">Welcome Back</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div style="background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem;">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; box-sizing: border-box;">
        </div>
        <button type="submit" style="width: 100%; padding: 14px; background: #0f9d58; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 20px; color: #666;">Don't have an account? <a href="/register/" style="color: #0f9d58; font-weight: bold;">Sign up</a></p>
</div>
{% endblock %}
