{% extends 'store/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
    <h2 style="color: #0f9d58; margin-bottom: 20px;">Password Reset Complete</h2>
    <p style="color: #6b7280;">Your password has been successfully reset. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" style="display: inline-block; margin-top: 20px; background: #0f9d58; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold;">Login Now</a>
</div>
{% endblock %}
