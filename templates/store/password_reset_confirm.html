{% extends 'store/base.html' %}
{% block content %}
<div style="max-width: 450px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e5e7eb;">
    <h2 style="text-align: center; margin-bottom: 10px; color: #1f2937;">Set New Password</h2>
    <p style="text-align: center; color: #6b7280; margin-bottom: 30px; font-size: 0.95rem;">Please enter your new password twice so we can verify it.</p>
    
    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label style="font-weight: 600; font-size: 0.9rem; color: #374151;">New Password</label>
            <input type="password" name="new_password1" required style="width: 100%; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 1rem; background: #f9fafb; margin-top: 5px;" onfocus="this.style.borderColor='#0f9d58'; this.style.background='white';">
        </div>
        
        <div style="margin-bottom: 25px;">
            <label style="font-weight: 600; font-size: 0.9rem; color: #374151;">Confirm New Password</label>
            <input type="password" name="new_password2" required style="width: 100%; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 1rem; background: #f9fafb; margin-top: 5px;" onfocus="this.style.borderColor='#0f9d58'; this.style.background='white';">
        </div>
        
        <button type="submit" style="width: 100%; padding: 14px; background: #0f9d58; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">Change Password</button>
    </form>
</div>
{% endblock %}
