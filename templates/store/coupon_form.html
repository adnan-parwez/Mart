{% extends 'store/base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; border: 1px solid #e5e7eb;">
    <h2 style="margin-top: 0; margin-bottom: 20px;">{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 15px;">
            {{ form.as_p }}
        </div>
        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" style="background: #0f9d58; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Save Coupon</button>
            <a href="{% url 'manage_coupons' %}" style="background: #f3f4f6; color: #374151; padding: 12px 20px; border-radius: 6px; font-weight: bold; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
