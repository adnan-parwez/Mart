{% extends 'store/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; margin-bottom: 20px;">Reset Password</h2>
    <p style="text-align: center; color: #6b7280; margin-bottom: 20px;">Enter your email address and we'll send you a link to reset your password.</p>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <input type="email" name="email" required placeholder="Enter your email" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;">
        </div>
        <button type="submit" style="width: 100%; padding: 14px; background: #0f9d58; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
