<!DOCTYPE html>
<html>
<head>
    <title>Checkout | Mini Mart</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; padding: 40px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .pay-option { display: flex; align-items: center; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .pay-option input { width: auto; margin-right: 15px; }
        button { width: 100%; padding: 15px; background: #0f9d58; color: white; border: none; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="first_name" placeholder="First Name" required>
            <input type="text" name="last_name" placeholder="Last Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <textarea name="address" placeholder="Full Address" required></textarea>
            
            <div style="display: flex; gap: 10px;">
                <input type="text" name="city" placeholder="City" required>
                <input type="text" name="pincode" placeholder="Pincode" required>
            </div>

            <h3>Payment Method</h3>
            <label class="pay-option">
                <input type="radio" name="payment_method" value="UPI" checked>
                <div><strong>UPI (GPay / PhonePe / Paytm)</strong></div>
            </label>
            <label class="pay-option">
                <input type="radio" name="payment_method" value="Cash on Delivery">
                <div><strong>Cash on Delivery (COD)</strong></div>
            </label>

            <button type="submit">Place Order</button>
        </form>
    </div>
</body>
</html>
